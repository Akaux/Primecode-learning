<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar</title>

    <link rel="stylesheet" href="cadastr.css">

    <link
        rel="icon"
        href="https://m.media-amazon.com/images/G/01/digital/video/DVUI/favicons/favicon.png"
    >
</head>

<body>

    <main id="card">

        <form action="https://www.amazon.com.br/?&tag=hydrbrabk-20&ref=pd_sl_7rwd1q78df_e&adgrpid=155790195778&hvpone=&hvptwo=&hvadid=677606588104&hvpos=&hvnetw=g&hvrand=7009282940339777117&hvqmt=e&hvdev=c&hvdvcmdl=&hvlocint=&hvlocphy=9196774&hvtargid=kwd-10573980&hydadcr=26346_11691057&mcid=b0b1e97acb143b58930b24716c21b623&hvocijid=7009282940339777117--&hvexpln=nav">

            <h1>Crie sua conta Amazon</h1>

            <div id="card-npt">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="input-style"
                    autocomplete="email"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    class="input-style"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmar-senha">Confirmar Senha</label>

                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    class="input-style"
                    autocomplete="new-password"
                    required
                >

                <label for="nascimento">Nascimento</label>

                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    class="input-style"
                    required
                >

<span class="titulo-genero">Gênero:</span>

<div class="genero">
    <label>
        <input type="radio" name="genero" value="M">
        Masculino
    </label>

    <label>
        <input type="radio" name="genero" value="F">
        Feminino
    </label>

    <label for="outro-genero">Outro gênero:</label>

    <select id="outro-genero" name="outro-genero" class="input-style">
        <option value="" selected disabled>Selecione uma opção</option>
        <option value="outro">Outro</option>
        <option value="nao-informar">Prefiro não informar</option>
    </select>
</div>
        </datalist>
                </div>

                <button type="submit" id="btn">
                    Cadastrar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
