<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        rel="icon"
        href="https://m.media-amazon.com/images/G/01/digital/video/DVUI/favicons/favicon.png"
    >

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div id="img">
            <a href="../menu/index.html">
                <img
                    src="https://logospng.org/download/amazon/logo-amazon-1536.png"
                    alt="Amazon"
                >
            </a>
        </div>

        <form action="#" method="post">

            <div id="menu">

                <div id="assets">

                    <h1>Faça login ou crie sua conta</h1>

                    <label for="email">
                        Insira um número de celular ou e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <h3>
                        Não possui login?
                        <a href="./cadastro.html">clique aqui</a>
                    </h3>

                    <button type="submit">
                        Continuar
                    </button>

                    <p class="terms">
                        Ao continuar, você concorda com as
                        <a href="#">Condições de Uso</a>
                        e a
                        <a href="#">Notificação de privacidade</a>
                        da Amazon.
                    </p>

                </div>

            </div>

        </form>

    </main>

</body>
</html>
